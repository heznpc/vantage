[project]
name = "vantage"
version = "0.1.0"
description = "Spatial-grounded predictive CCTV anomaly/theft detection — M1 contracts + eval harness"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "jsonschema>=4.23.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
